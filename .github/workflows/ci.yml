name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Parse Actor JSON files
        run: node --input-type=module -e "import fs from 'node:fs'; for (const file of ['INPUT_SCHEMA.json','input.json','.actor/actor.json','.actor/output_schema.json','.actor/dataset_schema.json']) JSON.parse(fs.readFileSync(file, 'utf8'));"
